<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title id="page-title"></title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <header class="site-header">
            <div class="container text-center">
                <h1 class="title" id="header-title"></h1>
                <p class="subtitle" id="header-subtitle"></p>
            </div>
        </header>
        <!-- BANNER -->
        <section class="banner">
            <div class="container text-center banner-content">
                <h2 id="banner-title"></h2>
                <p id="banner-subtitle"></p>
            </div>
        </section>

        <main class="container my-4">
            <div class="row mb-4 g-2">
                <div class="search-bar-wrapper mb-4">
                    <div class="search-box">
                        <input
                            type="text"
                            id="search"
                            placeholder="Cari produk..."
                        />

                        <div class="sort-dropdown">
                            <button id="sort-toggle" type="button">☰</button>

                            <div class="sort-menu" id="sort-menu">
                                <div data-sort="default">Default</div>
                                <div data-sort="low">Harga Termurah</div>
                                <div data-sort="high">Harga Termahal</div>
                            </div>
                        </div>
                    </div>

                    <select id="sort" class="d-none">
                        <option value="default">Default</option>
                        <option value="low">Harga Termurah</option>
                        <option value="high">Harga Termahal</option>
                    </select>
                </div>
            </div>

            <div id="product-list" class="row g-3"></div>

            <div id="loading" class="text-center py-3">Loading...</div>
        </main>

        <footer class="site-footer">
            <div class="container footer-grid">
                <div>
                    <div class="label">Contact</div>

                    <div>
                        <a id="footer-whatsapp" href="#"> WhatsApp </a>
                    </div>

                    <div>
                        <a id="footer-instagram" href="#"> Instagram </a>
                    </div>
                </div>

                <div>
                    <div class="label">Info</div>

                    <div id="footer-location"></div>

                    <div>
                        <a id="footer-facebook" href="#"> Facebook </a>

                        ·

                        <a id="footer-tiktok" href="#"> TikTok </a>
                    </div>
                </div>
            </div>

            <div class="footer-bottom">
                © 2026 <span id="footer-store-name"></span>. All rights
                reserved.
            </div>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
